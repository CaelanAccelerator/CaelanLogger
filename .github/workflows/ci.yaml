name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ clang

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      # Ubuntu kernels since 6.5.0-25 raised vm.mmap_rnd_bits from 28 to 32.
      # The sanitizer runtimes cannot map their shadow memory under that much
      # ASLR entropy and segfault during startup, before main() runs - randomly,
      # in roughly a fifth of runs. 28 is the only part of this that is a
      # workaround; nothing about the build or the code needs to change.
      - name: Lower ASLR entropy for the sanitizer runtime
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (ASan)
        run: |
          cmake -S . -B asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_ASAN=ON

      - name: Build
        run: cmake --build asan --parallel

      - name: Test (ASan)
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
        run: ctest --test-dir asan --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      # Same ASLR-vs-shadow-memory problem as the ASan job; TSan reports it as
      # "FATAL: ThreadSanitizer: unexpected memory mapping".
      - name: Lower ASLR entropy for the sanitizer runtime
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (TSan)
        run: |
          cmake -S . -B tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build tsan --parallel

      - name: Test (TSan)
        env:
          TSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:second_deadlock_stack=1"
        run: |
          ctest --test-dir tsan --output-on-failure -R LoggerIntegration.MultiThread_LoggedPlusDroppedEqualsAttempted
